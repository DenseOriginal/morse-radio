<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heltec LoRa Serial Chat</title>
    <style>
        body, html {
            height: 100%;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app-container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        header {
            background: #333;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            cursor: pointer;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            font-weight: bold;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #chat-window {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background: #ece5dd;
        }
        #device-tabs {
            display: flex;
            gap: 4px;
            padding: 8px 10px 0;
            background: #ece5dd;
        }
        .device-tab {
            flex: 1;
            padding: 7px 4px;
            border: 1px solid #ccc;
            background: #fff;
            color: #333;
        }
        .device-tab.active {
            background: #007bff;
            color: #fff;
        }
        .message {
            max-width: 80%;
            margin-bottom: 10px;
            padding: 10px 14px;
            border-radius: 15px;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.4;
        }
        .message.rx {
            align-self: flex-start;
            background: #fff;
            border-bottom-left-radius: 2px;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .message.tx {
            align-self: flex-end;
            background: #dcf8c6;
            border-bottom-right-radius: 2px;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .session-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 14px;
            color: #777;
            font-size: 11px;
            white-space: nowrap;
        }
        .session-divider::before,
        .session-divider::after {
            content: '';
            height: 1px;
            flex: 1;
            background: #c5c5c5;
        }
        #input-area {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
            border-top: 1px solid #ddd;
        }
        #message-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            margin-right: 10px;
            text-transform: uppercase;
        }
        #message-input:disabled {
            background: #e9e9e9;
        }
        #device-select {
            padding: 9px;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <span>Heltec V3 Chat</span>
        <div>
            <button id="connect-btn">Connect</button>
            <button id="disconnect-btn" disabled>Disconnect</button>
        </div>
    </header>

    <div id="device-tabs" role="tablist" aria-label="Device chats">
        <button class="device-tab active" data-device="1" role="tab">ID 1</button>
        <button class="device-tab" data-device="2" role="tab">ID 2</button>
        <button class="device-tab" data-device="3" role="tab">ID 3</button>
        <button class="device-tab" data-device="4" role="tab">ID 4</button>
        <button class="device-tab" data-device="5" role="tab">ID 5</button>
        <button class="device-tab" data-device="6" role="tab">ID 6</button>
        <button class="device-tab" data-device="7" role="tab">ID 7</button>
    </div>
    
    <div id="chat-window">
        <!-- Chat bubbles will appear here -->
    </div>
    
    <div id="input-area">
        <select id="device-select" disabled aria-label="Receiving device">
            <option value="*">All devices</option>
            <option value="1">Device 1</option>
            <option value="2">Device 2</option>
            <option value="3">Device 3</option>
            <option value="4">Device 4</option>
            <option value="5">Device 5</option>
            <option value="6">Device 6</option>
            <option value="7">Device 7</option>
        </select>
        <input type="text" id="message-input" placeholder="Type a message..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>
</div>

<script>
    let port;
    let reader;
    let writer;
    let keepReading = true;
    let incomingSerialData = '';
    let activeDevice = '1';
    const storageKey = 'heltec-lora-chat-history';
    const chatHistories = {};
    const pendingIncoming = {};
    const previousSession = {};
    for (let device = 1; device <= 7; device++) {
        chatHistories[String(device)] = [];
        pendingIncoming[String(device)] = '';
        previousSession[String(device)] = false;
    }

    function loadChatState() {
        try {
            const savedState = JSON.parse(localStorage.getItem(storageKey));
            if (!savedState) return;

            for (let device = 1; device <= 7; device++) {
                const id = String(device);
                if (Array.isArray(savedState.histories?.[id])) {
                    chatHistories[id] = savedState.histories[id].map((message) => ({
                        ...message,
                        session: 'previous'
                    }));
                }
                if (typeof savedState.pendingIncoming?.[id] === 'string') {
                    if (savedState.pendingIncoming[id]) {
                        chatHistories[id].push({
                            direction: 'rx',
                            text: savedState.pendingIncoming[id],
                            session: 'previous'
                        });
                    }
                }
                previousSession[id] = chatHistories[id].length > 0;
            }
        } catch (error) {
            console.warn('Could not load saved chat history:', error);
        }
    }

    function saveChatState() {
        try {
            localStorage.setItem(storageKey, JSON.stringify({
                histories: chatHistories,
                pendingIncoming
            }));
        } catch (error) {
            console.warn('Could not save chat history:', error);
        }
    }

    const connectBtn = document.getElementById('connect-btn');
    const disconnectBtn = document.getElementById('disconnect-btn');
    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const deviceSelect = document.getElementById('device-select');
    const deviceTabs = document.querySelectorAll('.device-tab');

    messageInput.disabled = true;
    sendBtn.disabled = true;

    // Verify browser support
    if (!('serial' in navigator)) {
        alert("Your browser does not support the Web Serial API. Please use Chrome, Edge, or Opera.");
    }

    async function connectSerial() {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });

            // Set up writer
            const textEncoder = new TextEncoderStream();
            textEncoder.readable.pipeTo(port.writable);
            writer = textEncoder.writable.getWriter();

            // Set up reader
            keepReading = true;
            readLoop();

            // Send BRG_ON to Heltec to activate bridge mode
            await writer.write("BRG_ON");

            // Update UI
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            deviceSelect.disabled = false;
            deviceTabs.forEach((tab) => tab.disabled = false);
            messageInput.focus();

        } catch (err) {
            console.error("Connection failed:", err);
        }
    }

    async function readLoop() {
        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        reader = textDecoder.readable.getReader();

        try {
            while (keepReading) {
                const { value, done } = await reader.read();
                if (done) {
                    break;
                }
                if (value) {
                    handleIncomingData(value);
                }
            }
        } catch (error) {
            console.error("Read error:", error);
        } finally {
            reader.releaseLock();
        }
    }

    function handleIncomingData(data) {
        incomingSerialData += data;
        const completeMessages = incomingSerialData.split('\n');
        incomingSerialData = completeMessages.pop();

        completeMessages.forEach((packet) => {
            const match = packet.match(/^BRG_RX:([1-7]):([01]):([\s\S]*)$/);
            if (!match) return;

            const sender = match[1];
            const isBroadcast = match[2] === '1';
            const message = match[3];
            const recipients = isBroadcast
                ? Object.keys(pendingIncoming)
                : [sender];
            recipients.forEach((recipient) => {
                pendingIncoming[recipient] += message;
            });
            saveChatState();
            if (isBroadcast || sender === activeDevice) renderChat();
        });
    }

    function renderChat() {
        chatWindow.replaceChildren();
        const previousMessages = chatHistories[activeDevice].filter(
            (message) => message.session === 'previous'
        );
        const currentMessages = chatHistories[activeDevice].filter(
            (message) => message.session !== 'previous'
        );

        previousMessages.forEach((message) => {
            const bubble = document.createElement('div');
            bubble.classList.add('message', message.direction);
            bubble.textContent = message.text;
            chatWindow.appendChild(bubble);
        });

        if (previousSession[activeDevice]) {
            const divider = document.createElement('div');
            divider.className = 'session-divider';
            divider.textContent = 'Previous session';
            chatWindow.appendChild(divider);
        }

        currentMessages.forEach((message) => {
            const bubble = document.createElement('div');
            bubble.classList.add('message', message.direction);
            bubble.textContent = message.text;
            chatWindow.appendChild(bubble);
        });

        if (pendingIncoming[activeDevice]) {
            const pendingBubble = document.createElement('div');
            pendingBubble.classList.add('message', 'rx');
            pendingBubble.textContent = pendingIncoming[activeDevice];
            chatWindow.appendChild(pendingBubble);
        }
        scrollToBottom();
    }

    function selectDevice(device) {
        if (!chatHistories[device]) return;
        activeDevice = device;
        deviceSelect.value = device;
        deviceTabs.forEach((tab) => {
            tab.classList.toggle('active', tab.dataset.device === device);
            tab.setAttribute('aria-selected', tab.dataset.device === device);
        });
        renderChat();
    }

    async function sendMessage() {
        const text = messageInput.value?.trim().toUpperCase();
        if (!text || !writer) return;

        const device = deviceSelect.value;
        try {
            await writer.write(`BRG_SEND:${device}:${text}`);
        } catch (error) {
            console.error('Could not send message:', error);
            return;
        }

        const recipients = device === '*'
            ? Object.keys(chatHistories)
            : [device];
        recipients.forEach((recipient) => {
            if (pendingIncoming[recipient]) {
                chatHistories[recipient].push({
                    direction: 'rx',
                    text: pendingIncoming[recipient],
                    session: 'current'
                });
                pendingIncoming[recipient] = '';
            }
        });

        recipients.forEach((recipient) => {
            chatHistories[recipient].push({ direction: 'tx', text, session: 'current' });
        });
        saveChatState();
        renderChat();

        // Clear input field
        messageInput.value = '';

        incomingSerialData = '';
    }

    async function disconnectSerial() {
        keepReading = false;
        
        if (writer) {
            // Tell Heltec to exit bridge mode before closing
            await writer.write("BRG_OFF");
            await writer.releaseLock();
        }
        
        if (reader) {
            await reader.cancel();
        }
        
        if (port) {
            await port.close();
        }

        writer = null;
        port = null;

        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        messageInput.disabled = true;
        sendBtn.disabled = true;
        deviceSelect.disabled = true;
        deviceTabs.forEach((tab) => tab.disabled = true);
    }

    function scrollToBottom() {
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // Event Listeners
    connectBtn.addEventListener('click', connectSerial);
    disconnectBtn.addEventListener('click', disconnectSerial);
    sendBtn.addEventListener('click', sendMessage);
    deviceTabs.forEach((tab) => {
        tab.addEventListener('click', () => selectDevice(tab.dataset.device));
    });
    deviceSelect.addEventListener('change', () => selectDevice(deviceSelect.value));
    
    // Allow pressing "Enter" to send
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    loadChatState();
    renderChat();
</script>

</body>
</html>
